DocumentRoot /var/www/public/

# deny access to the .git folder
<Directorymatch "^/.*/\.git/">
  Order deny,allow
  Deny from all
</Directorymatch>

<Directory /var/www/public/>
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Order allow,deny
    Allow from all

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # CVE-2026-109618 / CVE-2026-109619 mitigation: pin memory_limit via
    # php_admin_value (not php_value) so it cannot be lowered again by a
    # .htaccess file, which AllowOverride All permits in this directory.
    <IfModule php_module>
        php_admin_value memory_limit -1
    </IfModule>
</Directory>
